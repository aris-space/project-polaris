name: CI (colcon build)

on:
  push:
    branches:
      - main
      - dev
      - test-ci
      - 'feature/**'
      - 'test/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      # Using a container saves ~2 minutes of setup time
      image: ros:humble-ros-base 
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies with rosdep
        run: |
          # The container already has ROS, but we need the specific package deps
          sudo apt update
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y --rosdistro humble

      - name: Build with colcon
        run: |
          # Source ROS and build - this now runs for ALL branches
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install