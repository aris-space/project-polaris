name: CI (colcon build)

on:
  push:
    branches:
      - main
      - dev
      - test-ci
      - 'feature/**'
      - 'test/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Full ROS 2 + colcon setup for heavy branches
      - name: Full ROS 2 + colcon setup
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/test-ci'
        run: |
          sudo apt update
          sudo apt install -y software-properties-common curl gnupg lsb-release

          # Add ROS 2 repository
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/ros2.list

          sudo apt update
          sudo apt install -y python3-colcon-common-extensions python3-pip ros-humble-ros-core ros-humble-ros-base python3-rosdep
          pip3 install -U colcon-core colcon-ros

          sudo rosdep init || echo "rosdep already initialized"
          rosdep update
          source /opt/ros/humble/setup.bash
          rosdep install --from-paths src --ignore-src -r -y --rosdistro humble

      # Build with colcon
      - name: Build workspace
        run: |
          if [[ -f /opt/ros/humble/setup.bash ]]; then
            source /opt/ros/humble/setup.bash
            echo "Running full colcon build with ROS environment"
            colcon build --symlink-install
          else
            echo "Running lightweight colcon build (no ROS environment)"
            # Minimal build for feature/test/fix branches
            colcon build --symlink-install --cmake-args -DBUILD_TESTING=OFF
          fi

      # Run tests only on heavy branches
      - name: Run tests
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/test-ci'
        run: |
          source install/setup.bash
          colcon test
          colcon test-result --verbose

      # Optional: confirm build succeeded
      - name: Check build success
        run: |
          if [[ ! -f build/pt_gelb_pkg/colcon_command_prefix_build.log ]]; then
            echo "Build log not found — build likely failed"
            exit 1
          fi
          echo "Build completed successfully"

      # Optional: Run tests