name: build-and-push

on:
  push:
    branches: [ "test" ]     # build on test branch
    tags: [ "v*" ]           # and on version tags like v1.2.3

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/docker-test

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate tags & labels automatically:
      # - On branch `test`: :test + :sha-<short>
      # - On tag v1.2.3: :v1.2.3 + :1.2 + :1 + :latest
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # branch builds
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/test' }}
            # tag builds (v* -> semver tags)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./docker-test
          file: ./docker-test/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
