services:
  jetson-container:
    image: ghcr.io/aris-space/project-polaris-docker:runtime-v1.0.0
    container_name: jetson-container
    privileged: true
    network_mode: host
    runtime: nvidia
    
    environment:
      - ROS_DOMAIN_ID=37
      - ROS_WS=/ros2_ws
      - NTRIP_HOST=${NTRIP_HOST:-www.swipos.ch}
      - NTRIP_PORT=${NTRIP_PORT:-2101}
      - NTRIP_MOUNTPOINT=${NTRIP_MOUNTPOINT:-MSM_GISGEO_LV95LHN95}
      - NTRIP_USE_HTTPS=${NTRIP_USE_HTTPS:-false}
      - NTRIP_USERNAME=${NTRIP_USERNAME:-}
      - NTRIP_PASSWORD=${NTRIP_PASSWORD:-}
      - AUTO_BUILD=1
      - REFRESH_PY_PACKAGES=1
      - CLEAN_BUILD=0
      - ROSDEP_INSTALL=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - SSH_AUTH_SOCK=/run/host-ssh-agent
    
    volumes:
      - .:/ros2_ws
      - ./recordings:/ros2_ws/recordings
      - /dev:/dev
      - ./mavlink_logs:/root/polaris_logs/
      - /home/polaris5:/home/polaris5
      - ${SSH_AUTH_SOCK}:/run/host-ssh-agent
    
    working_dir: /ros2_ws
    entrypoint: [ "/bin/bash", "/ros2_ws/entrypoint.sh" ]
    stdin_open: true
    tty: true
    command: [ "bash", "-lc", "sleep infinity" ]
    restart: unless-stopped