services:
  jetson-container:
    image: ghcr.io/aris-space/project-polaris-docker:runtime
    container_name: jetson-container
    privileged: true
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_WS=/ros2_ws
      - NTRIP_USERNAME=${NTRIP_USERNAME:-}
      - NTRIP_PASSWORD=${NTRIP_PASSWORD:-}
      - AUTO_BUILD=1
      - REFRESH_PY_PACKAGES=1
      - CLEAN_BUILD=1
      - ROSDEP_INSTALL=1
    devices:
      - /dev:/dev
    volumes:
      - .:/ros2_ws
      - ./recordings:/ros2_ws/recordings
      - /dev:/dev
    working_dir: /ros2_ws
    entrypoint: ["/bin/bash", "/ros2_ws/entrypoint.sh"]
    stdin_open: true
    tty: true
    command: ["bash", "-lc", "sleep infinity"]
    restart: unless-stopped