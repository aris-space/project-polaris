# colcon defaults for the :sim image only. Its Dockerfile.sim (aris-space/project-polaris-docker) sets
# COLCON_DEFAULTS_FILE=/ros2_ws/src/simulation/colcon_sim_defaults.yaml.
# src/simulation/COLCON_IGNORE hides the sim packages from recursive discovery; listing their
# directories explicitly as base paths builds them without deleting that file.
# '.' (not 'src') matches colcon's default discovery, which also finds ping-python and
# top_station's recorder node. Paths are relative to the workspace root (/ros2_ws). Add new sim packages here.
build:
  base-paths: [., src/simulation/orca_description, src/simulation/orca_sim_bringup, src/simulation/orca_sim_sensors]
  packages-skip: [foxglove_bridge]
list:
  base-paths: [., src/simulation/orca_description, src/simulation/orca_sim_bringup, src/simulation/orca_sim_sensors]
test:
  base-paths: [., src/simulation/orca_description, src/simulation/orca_sim_bringup, src/simulation/orca_sim_sensors]
