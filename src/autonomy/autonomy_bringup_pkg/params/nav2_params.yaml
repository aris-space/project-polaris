bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"] # also here different checker?
    controller_plugins: ["LongStraightLine", "SharpTurn"]

    # Progress checker parameters
    progress_checker:
      plugin: "orca_nav2/ProgressChecker3D"
      radius: 0.5
      time_allowance: 10.0

    # Goal checker parameters
    goal_checker:
      plugin: "orca_nav2/GoalChecker3D"
      xy_goal_tolerance: 0.3
      z_goal_tolerance: 0.25

    # Controller parameters
    LongStraightLine:
      plugin: "orca_nav2/PurePursuitController3D"
      lookahead_dist: 2.5
      transform_tolerance: 1.0
      goal_tolerance: 0.2
      tick_rate: 20.0

      x_vel: 0.4
      x_accel: 0.2
      z_vel: 0.25
      z_accel: 0.2
      yaw_vel: 0.3
      yaw_accel: 0.35

      # Tracking topics: 3x Float64 + PointStamped + PoseStamped + TwistStamped (see README)
      publish_tracking_error: true

      # Cross-track velocity damping (PD derivative term on lateral error).
      # angular.z -= K_cross_vel * v_cross,  where v_cross = vel.x*sin(yaw_err) + vel.y*cos(yaw_err)
      # Units: (rad/s) / (m/s).  0.0 = disabled.  Conservative starting point: 0.3.
      K_cross_vel: 0.0

      # Velocity-divergence emergency threshold (rad).
      # If the velocity vector points more than this angle off the path tangent:
      #   1. Publishes False  on /pixhawk/arm_cmd  → disarm
      #   2. Publishes MANUAL on /pixhawk/mode_cmd → manual mode
      #   3. Throws ControllerException            → aborts navigation
      max_velocity_divergence_rad: 1.22  # 70 deg — fires symmetrically for both into and away from path
      min_speed_divergence_check: 0.25  # m/s — skip check when nearly stopped

      # Breaking
      K_descelerate: 0.17

      # ── Regulated Pure Pursuit ──────────────────────────────────────────────
      # Rotate-to-heading: stop translating and rotate in place when the heading
      # error to the curvature carrot exceeds rotate_to_heading_min_angle.
      # Hysteresis: engages at min_angle, releases only at the smaller release_angle
      # to prevent premature exit and the cross-track drift that follows.
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.2  # rad/s — max rotation speed
      rotate_to_heading_min_angle: 1.22    # rad (70 deg) — only rotate-in-place for sharp turns
      rotate_to_heading_release_angle: 0.1 # rad (~3 deg) — MUST be < v²/(2*decel) = 0.1²/(2*0.05) = 0.1 rad
      # Real AUV angular braking capability (rad/s²) — used in sqrt decel formula.
      # Much lower than yaw_accel (ramp rate) because water drag limits actual decel.
      # Braking starts at dist = v²/(2*decel) from target. With v=0.1, decel=0.05 → 0.1 rad.
      rotate_to_heading_decel: 0.05

      # Stateful goal heading: once within XY goal tolerance, stay in heading-align
      # mode even if the robot drifts slightly back out of tolerance.
      stateful: false

      # Velocity-scaled lookahead: lookahead = speed * lookahead_time (clamped).
      # Keep false until basic heading behaviour is confirmed good.
      use_velocity_scaled_lookahead: false
      min_lookahead_dist: 1.25
      max_lookahead_dist: 2.5
      lookahead_time: 6.25

      # Fixed curvature lookahead: measure curvature at this fixed distance regardless
      # of the main lookahead. Breaks the slow→short lookahead→high curvature feedback loop.
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 2.5  # m — matched to lookahead_dist

      # Curvature-regulated linear velocity: scale forward speed down when the turning
      # radius falls below regulated_linear_scaling_min_radius.
      use_regulated_linear_vel_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05

      # Approach velocity: ramp forward speed down over the last N metres to goal.
      min_approach_linear_velocity: 0.0
      approach_velocity_scaling_dist: 4.5

    SharpTurn:
      plugin: "orca_nav2/SharpTurnController3D"
      lookahead_dist: 1.0
      transform_tolerance: 1.0
      goal_tolerance: 0.2
      tick_rate: 20.0
      
      z_vel: 0.3
      z_accel: 0.3
      yaw_vel: 0.25
      yaw_accel: 0.5
      yaw_P_gain: 0.02 # TODO: Very small

      # The motion model may be bogus, so actual velocity may be lower or higher than desired
      # velocity. Specify a range using the error terms, e.g.,
      # [(1 - yaw_error_) * yaw_vel_, (1 + yaw_error_) * yaw_vel_]
      # x_error: 0.5
      # yaw_error: 0.6
      # Tracking topics: 3x Float64 + PointStamped + PoseStamped + TwistStamped (see README)
      publish_tracking_error: true

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True


# The local costmap is always empty
# This configuration can probably be simplified, e.g., there's no laser scanner
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: ""
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: ""
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.5


planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["StraightLine"]

    # OrcaPlanner parameters
    StraightLine:
      plugin: "orca_nav2/StraightLinePlanner3D"
      planning_dist: 0.05    # Plan a pose every planning_dist meters
      # Fpr step reponse - NOT To BE MERGED into dev!!
      use_fixed_start: false # Set true for step response tests
      fixed_start_x: 0.0    # X of ideal path start in map frame (lon direction)
      fixed_start_y: 0.0    # Y of ideal path start in map frame (lat direction)


planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

# Nav2 Humble: use behavior_plugins + nav2_behaviors/* (not recovery_plugins / nav2_recoveries).
# Wrong names/types leave behavior_server configure failing → unconfigured forever.
behavior_server:
  ros__parameters:
    costmap_topic: "local_costmap/costmap_raw"
    footprint_topic: "local_costmap/published_footprint"
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: "odom"
    robot_base_frame: "base_link"
    transform_timeout: 2.0
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: False
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 1250   # Sleep for 2000ms