navsat_transform_node:
  ros__parameters:
    frequency: 10.0
    delay: 0.0
    # Same WMM east-positive declination as live config (datum lat/lon below)
    magnetic_declination_radians: 0.0586912
    yaw_offset: 0.0
    zero_altitude: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    # Fixed datum for Lake St. Moritz — avoids crash when the first GNSS
    # message in a bag has invalid coordinates (no-fix or garbage values).
    wait_for_datum: true
    datum:
      - 47.3300
      - 8.5700
      - 453.0
    broadcast_utm_transform: false
    broadcast_utm_transform_as_parent_frame: false
