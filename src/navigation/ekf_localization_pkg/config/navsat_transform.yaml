# IMU: Xsens Sirius (MTi 600-series AHRS). Per Xsens MTi family reference manual, default
# local frame is ENU; in ENU, yaw is 0° with sensor x toward East and 90° with x toward North
# (Table 7 — body S to local L). `yaw_offset` is not a Sirius setting; it is robot_localization’s
# extra heading rotation so the IMU yaw matches what navsat_transform expects for GNSS projection.
navsat_transform_node:
  ros__parameters:
    frequency: 10.0
    # delay: time (s) navsat_transform waits after spawn before computing the
    # first GPS-to-world-frame transform. With use_odometry_yaw: true, this
    # gives the /odometry/filtered/local_validated subscription time to
    # settle so the world-frame rotation is locked using a *current* yaw
    # rather than whatever happened to be in the buffer (or yaw=0 if no odom
    # message has arrived yet). Locking with yaw=0 puts /odometry/gps in a
    # frame rotated by the AUV's actual heading at lock time, while the
    # global EKF's predict step uses the correct filtered yaw — that
    # mismatch produces persistent rotational error in GPS innovations and
    # the bounded ~10–60 km divergence we kept seeing.
    # 3 s is the value recommended in robot_localization community guidance
    # for the use_odometry_yaw=true case. Empirical trend test on
    # zermatt_rectangle_01 ruled out delay as the dominant fix:
    #   delay=0  → 57 km final divergence
    #   delay=3  → 50 km
    #   delay=10 → 38 km
    #   delay=30 → 51 km   (non-monotonic = run-to-run noise dominates the
    #                       trend, not a real signal)
    # Settled on 3 s as the documented community recommendation; harmless if
    # the race isn't biting and modestly helpful if it is.
    delay: 3.0
    # Set to 0 because the IMU is in VRU mode (gyro-only yaw, no magnetometer reference).
    # Declination compensates magnetic->true north and only applies when the IMU heading
    # is referenced to magnetic north. In VRU, yaw_0 is the boat's physical orientation at
    # boot (we boot pointing true East), so no further correction is needed.
    # Restore to 0.0586912 (East-positive WMM, ~47.32 N 8.58 E, 2026-04) if returning to NorthReference.
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: false
    publish_filtered_gps: true
    # use_odometry_yaw: TRUE — pull yaw continuously from the local-EKF
    # filtered odometry instead of snapshotting raw IMU yaw at datum-set.
    #
    # With FALSE, navsat_transform locks the UTM↔map rotation to whatever
    # raw IMU yaw was at the moment of the first valid fix, then never
    # updates it. The global EKF's predict step uses the *current* filtered
    # local-EKF yaw, which evolves over time. Even small persistent
    # disagreement between those two yaw values produces a rotational frame
    # mismatch between /odometry/gps and the EKF's predicted position —
    # GPS innovations contain a non-physical rotation component, the EKF
    # tries to correct it, predict re-introduces it, and the state drifts
    # to a bounded but non-zero equilibrium (observed: ~10 km divergence
    # on this dataset). Local EKF doesn't see this because it never
    # consumes /odometry/gps; only the global EKF gets stuck between the
    # two pictures of the world. Documented in robot_localization
    # issue #325 ("Rare issue caused by navsat_transform and bad IMU
    # data") and ROS Answers #287125 ("drift due to initial IMU reading").
    # The known fix is exactly use_odometry_yaw: true.
    use_odometry_yaw: true
    wait_for_datum: true
    broadcast_utm_transform: false
    broadcast_utm_transform_as_parent_frame: false

