# POLARIS identified dynamic model — single working copy.
# Fit scripts update it through model_io.update_parameters(); validation scripts load it and
# record the version tag. Git history keeps every earlier state.
# `source` is one of: measured | fitted | assumed | sim.  `value: null` means not yet determined.
# Note: update_parameters() rewrites this file with PyYAML, which drops comments.

model:
  name: polaris_sysid
  version: 0.0.1
  date: 2026-10-05
  frame: base_link
  description: Initial skeleton, no parameters determined yet.
  fitted_from: []   # rosbags used for the fitted parameters
  notes: ""

parameters:
  rigid_body:
    m:     {value: null, unit: kg,      source: measured, uncertainty: null}
    I_xx:  {value: null, unit: kg m^2,  source: measured, uncertainty: null}
    I_yy:  {value: null, unit: kg m^2,  source: measured, uncertainty: null}
    I_zz:  {value: null, unit: kg m^2,  source: measured, uncertainty: null}

  added_mass:
    X_udot: {value: null, unit: kg,      source: fitted, uncertainty: null}
    K_pdot: {value: null, unit: kg m^2,  source: fitted, uncertainty: null}
    M_qdot: {value: null, unit: kg m^2,  source: fitted, uncertainty: null}
    N_rdot: {value: null, unit: kg m^2,  source: fitted, uncertainty: null}

  damping_linear:
    X_u: {value: null, unit: N s/m,      source: fitted, uncertainty: null}
    K_p: {value: null, unit: N m s/rad,  source: fitted, uncertainty: null}
    M_q: {value: null, unit: N m s/rad,  source: fitted, uncertainty: null}
    N_r: {value: null, unit: N m s/rad,  source: fitted, uncertainty: null}

  damping_quadratic:
    X_uu: {value: null, unit: N s^2/m^2,      source: fitted, uncertainty: null}
    K_pp: {value: null, unit: N m s^2/rad^2,  source: fitted, uncertainty: null}
    M_qq: {value: null, unit: N m s^2/rad^2,  source: fitted, uncertainty: null}
    N_rr: {value: null, unit: N m s^2/rad^2,  source: fitted, uncertainty: null}

  restoring:
    K_phi:   {value: null, unit: N m/rad, source: fitted, uncertainty: null}   # roll stiffness
    M_theta: {value: null, unit: N m/rad, source: fitted, uncertainty: null}   # pitch stiffness
    # Equilibrium (trim) angles the restoring torque pulls back towards. Zero only if the
    # vehicle floats exactly level; measure from a still, powered-down float.
    phi_0:   {value: null, unit: rad, source: measured, uncertainty: null}     # roll trim
    theta_0: {value: null, unit: rad, source: measured, uncertainty: null}     # pitch trim

# Actuation. Not fitted: the thruster curves come from the manufacturer datasheet (later the
# load cell) and the channel/neutral/sign describe how servo_output_raw maps onto surge force.
# Paths are relative to this file.
thrust:
  channel: 0                  # index into /pixhawk/servo_output_raw; MOT_1 is the surge thruster
  pwm_neutral: 1500
  servo_delay_s: 0.0          # subtracted from servo log_time before pairing with the EKF
  sign: 1                     # flip to -1 if PWM > neutral drives the vehicle backwards
  # Per servo channel: force table over PWM and battery voltage (columns pwm_us,
  # force_kgf_<V>V), evaluated with thruster_map.ThrusterMap at the BMS voltage. Takes
  # precedence over curve_file. Channels not listed have no curve yet and are reported as
  # unknown (NaN), never as zero thrust.
  maps:
    0: thruster_curves/t500_force_vs_voltage.csv   # MOT_1 surge, Blue Robotics T500 datasheet
  voltage_fallback_v: null    # used only when a bag has no BMS voltage on /diagnostics
  curve_file: null            # single-voltage table (pwm_us, force_kgf); used by dummy models
  source: manufacturer datasheet

  # Per-axis thruster allocation. `channel` is the index into servo_output_raw (MOT_n -> n-1).
  # `lever_m` is the ABSOLUTE moment arm in metres, taken from scripts/custom_frame_helper.py
  # (r_i x d_i about the CoM, before that script normalises each column), so
  #     tau_axis = sum_i lever_m_i * F(pwm_i, voltage)
  # comes out directly in N m. For the translational axes lever_m is the dimensionless
  # direction cosine and the sum is in N.
  #
  # Channel mapping was resolved by matching the helper script's thruster numbering to the
  # report's MOT rows by geometry: MOT_1=T1, MOT_2=T2, MOT_3=T4, MOT_4=T5, MOT_5=T6, MOT_6=T3.
  allocation:
    surge:                    # MOT_1 is the only thruster with forward authority
      - {channel: 0, lever_m: 1.0}        # MOT_1, direction cosine (force, not torque)
    pitch:                    # three vertical thrusters; sign convention pitch = -torque_y
      - {channel: 2, lever_m: -0.5508}    # MOT_3 (helper T4, rear pair)
      - {channel: 3, lever_m: -0.5508}    # MOT_4 (helper T5, rear pair)
      - {channel: 4, lever_m:  0.6358}    # MOT_5 (helper T6, front)
      - {channel: 0, lever_m: -0.0300}    # MOT_1: surge thruster sits 3 cm off the CoM in z,
                                          # so it pitches the vehicle slightly. The report
                                          # rounds this to 0; it is kept here because it makes
                                          # surge and pitch weakly coupled through actuation.

# Which DOFs the propagation integrates, and which it takes from the EKF.
dofs:
  surge: modelled
  sway: measured
  heave: measured
  roll: measured
  pitch: measured
  yaw: measured
